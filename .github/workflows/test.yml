name: Tests

on:
    push:
        branches: ['**']
    pull_request:
        branches: ['**']

jobs:
    ci:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            # Not actions/setup-node's `cache: npm`: that requires a committed
            # package-lock.json, which the template itself does not have.
            - uses: actions/cache@v4
              with:
                  path: ~/.npm
                  key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json', 'package.json') }}
                  restore-keys: npm-${{ runner.os }}-

            - name: Install dependencies
              run: |
                  if [ -f package-lock.json ]; then npm ci; else npm install; fi

            - run: npm run build
            - run: npm test
            - run: npm run lint

            # A plugin adopts the template with one unrelated-histories merge;
            # after that the merge commit is what makes every later sync an
            # ordinary 3-way merge. Squash- or rebase-merging a sync PR destroys
            # it and silently breaks all future updates, so fail loudly instead.
            - name: Template ancestry intact
              if: hashFiles('agents/template/template-sync.md') != ''
              run: |
                  git remote get-url template >/dev/null 2>&1 || exit 0
                  git fetch --quiet template
                  if [ -z "$(git merge-base --all HEAD template/master)" ]; then
                    echo "::error::No merge base with the template — the adoption merge commit was lost." >&2
                    exit 1
                  fi
