name: Publish Release

# Manual, because releasing an Obsidian plugin is a deliberate act: the version
# bump is also a commit and a tag on master.
on:
    workflow_dispatch:
        inputs:
            version-part:
                description: Part of version number to bump
                required: true
                type: choice
                options:
                    - minor
                    - patch
            release-title:
                description: Title for the release
                required: false
                type: string

permissions:
    contents: write
    id-token: write
    attestations: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6

            - uses: actions/setup-node@v6
              with:
                  node-version: '22'

            - name: git config
              run: |
                  git config user.email github-robot@github.com
                  git config user.name github-robot

            - name: up version
              id: bump-version
              run: |
                  CURRENT_VERSION=$(node -p "require('./package.json').version")

                  # An X.Y.Z-pre-release version releases as X.Y.Z instead of
                  # bumping — that is how a plugin ships its first release.
                  npm config set tag-version-prefix ""
                  if [[ "$CURRENT_VERSION" == *-pre-release ]]; then
                    VERSION="${CURRENT_VERSION%-pre-release}"
                    npm version "$VERSION"
                  else
                    npm version "${{ github.event.inputs.version-part }}"
                    VERSION=$(node -p "require('./package.json').version")
                  fi

                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: build
              run: |
                  npm ci
                  npm run build

            - name: check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: attest build provenance
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: push tag to github
              run: |
                  git push origin
                  git push origin --tags

            - name: create release
              uses: softprops/action-gh-release@v2
              with:
                  name: ${{ steps.bump-version.outputs.version }} ${{ github.event.inputs.release-title }}
                  tag_name: ${{ steps.bump-version.outputs.version }}
                  generate_release_notes: true
                  files: |
                      main.js
                      manifest.json
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
